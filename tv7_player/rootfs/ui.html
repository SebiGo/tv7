<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV7 Player</title>
<style>
  :root {
    --bg: #eef0f4; --bg2: #e4e7ee; --card: rgba(255,255,255,.82); --card-solid: #ffffff; --text: #181a1f; --muted: #667080; --line: rgba(24,26,31,.10);
    --accent: #ed6874; --accent2: #d94a5b; --accent-text: #ffffff; --glow: rgba(237,104,116,.35);
    --ok: #1f9d57; --bad: #d03a3a; --shadow: 0 8px 28px rgba(30,40,60,.10);
    --hero: linear-gradient(135deg, #ffffff 0%, #fff0f1 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --bg2: #171a20; --card: rgba(30,34,41,.78); --card-solid: #1e2229; --text: #eceef2; --muted: #98a1ae; --line: rgba(255,255,255,.09);
      --accent: #f0707c; --accent2: #e04a5c; --glow: rgba(240,112,124,.38);
      --ok: #46c27a; --bad: #ef6b6b; --shadow: 0 10px 34px rgba(0,0,0,.45);
      --hero: linear-gradient(135deg, #232831 0%, #2c2026 100%);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  svg.i { width: 1em; height: 1em; fill: currentColor; display: block; }
  html { scrollbar-color: var(--muted) transparent; }
  body { margin: 0; color: var(--text); min-height: 100vh;
    background: radial-gradient(1200px 500px at 85% -10%, var(--glow), transparent 60%), linear-gradient(180deg, var(--bg), var(--bg2)) fixed;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 40px; }
  button { font: inherit; cursor: pointer; color: inherit; }
  [hidden] { display: none !important; }
  code { font: 13px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }

  /* header */
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand img { height: 34px; width: auto; display: block; }
  .brand span { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 4px; }
  .tabs { display: inline-flex; padding: 4px; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(8px); }
  .tab { border: 0; background: transparent; padding: 7px 18px; border-radius: 999px; color: var(--muted); font-weight: 600; transition: .15s; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-text); box-shadow: 0 4px 14px var(--glow); }

  /* nerd mode: a toggle in the same pill as the tabs, and the technical details card */
  .tab[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-text); box-shadow: 0 4px 14px var(--glow); }
  body:not(.nerd-on) .ch .nr { display: none; }
  body:not(.nerd-on) .ch .name { font-size: 17px; }
  .support { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
  .support .hint { margin: 0; flex: 1 1 260px; }
  .support textarea { width: 100%; min-height: 220px; font: 12px ui-monospace, Menlo, Consolas, monospace; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-solid); color: var(--text); }
  .nerd-card { font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .nerd-card::before { content: "<nerdmode>"; display: block; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
  .nerd-card::after { content: "</nerdmode>"; display: block; color: var(--accent); font-weight: 700; margin-top: 10px; }
  .nerd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 14px; }
  /* every block of nerd mode: its heading, then its content in a frame (like the two logs) */
  .nerd-frame { margin: 6px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--card-solid); border: 1px solid var(--line); }
  .nerd-env { display: grid; gap: 14px; margin-top: 14px; }
  .nerd-card table { font-size: 13px; }
  .nerd-card td { padding: 4px 8px; word-break: break-word; }
  .nerd-grid td:first-child { color: var(--muted); width: 45%; }
  .nerd-grid h2, .nerd-env h2, .nerd-log-head h2 { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; }
  .nerd-log-head { display: flex; align-items: center; margin-top: 16px; }
  .nerd-log-head h2 { margin: 0; }
  .nerd-log { max-height: 260px; overflow: auto; margin: 6px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--card-solid); border: 1px solid var(--line); font-size: 12px; white-space: pre-wrap; word-break: break-word; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
  h2 { font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
  .msg { padding: 10px 14px; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--bad); color: var(--bad); background: var(--card); }

  /* hero / now playing */
  .hero { background: var(--hero); border: 1px solid var(--line); border-radius: 26px; padding: 22px; margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 70%); pointer-events: none; }
  .hero-logo { height: 56px; width: 92px; object-fit: contain; margin-right: 14px; flex: none; }
  .titlebar { display: flex; align-items: center; }
  details.card > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.card > summary::before { content: "▸"; color: var(--accent); transition: transform .15s; }
  details.card[open] > summary::before { transform: rotate(90deg); }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card[open] > summary { margin-bottom: 12px; }
  .footer { text-align: center; font-size: 12px; color: var(--muted); margin: 26px 0 6px; }
  .hero-row { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; position: relative; z-index: 1; }
  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; gap: 10px; align-items: center; }
  .title { font-size: clamp(24px, 5vw, 38px); font-weight: 800; line-height: 1.1; margin: 6px 0 4px; letter-spacing: -.01em; min-height: 1.1em; }
  .sub { color: var(--muted); font-size: 14px; min-height: 1.3em; }
  .eq { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
  .eq i { width: 3px; height: 4px; background: var(--muted); border-radius: 2px; display: block; }
  .playing .eq i { background: var(--accent); animation: eq 0.9s ease-in-out infinite; }
  .playing .eq i:nth-child(2) { animation-delay: .15s; } .playing .eq i:nth-child(3) { animation-delay: .3s; } .playing .eq i:nth-child(4) { animation-delay: .45s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 16px; } }
  @media (prefers-reduced-motion: reduce) { .playing .eq i { animation: none; height: 10px; } }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { cursor: help; white-space: nowrap; display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--card-solid); font-weight: 600; }
  .chip.ok { color: var(--ok); border-color: var(--ok); } .chip.bad { color: var(--bad); border-color: var(--bad); }
  .transport { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; position: relative; z-index: 1; }
  .round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card-solid); font-size: 20px; display: inline-grid; place-items: center; transition: .15s; }
  .round:hover { border-color: var(--accent); transform: translateY(-1px); }
  .round.big { width: 64px; height: 64px; font-size: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: var(--accent-text); box-shadow: 0 8px 22px var(--glow); }
  .round.big:hover { filter: brightness(1.08); }
  .round:focus-visible, .tab:focus-visible, .ch:focus-visible, .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .vol { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 220px; margin-left: 8px; }
  .vol .round { width: 38px; height: 38px; font-size: 18px; }
  .vol-val { min-width: 3.4em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 8px; border-radius: 999px; background: var(--line); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card-solid); box-shadow: 0 2px 8px var(--glow); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card-solid); }

  /* channel list */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
  .toolbar input[type=search] { flex: 1 1 220px; padding: 11px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-solid); color: var(--text); font: inherit; }
  .toolbar input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--card-solid); }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-text); }
  .btn { border: 1px solid var(--line); background: var(--card-solid); border-radius: 999px; padding: 9px 16px; font-weight: 600; transition: .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .card + .card { margin-top: 0; }
  .list-title { display: flex; align-items: center; gap: 8px; }
  .ch { position: relative; text-align: left; border: 1px solid var(--line); background: var(--card-solid); border-radius: 16px; padding: 11px 12px; display: flex; gap: 10px; align-items: center; transition: transform .12s, border-color .12s, box-shadow .12s; }
  .ch:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 8px 20px var(--glow); }
  .ch .logo { flex: none; width: 84px; height: 54px; object-fit: contain; }
  .ch .meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .ch .nr { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ch .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .star { position: absolute; top: 4px; right: 6px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; cursor: pointer; opacity: .55; }
  .star:hover, .star.on { opacity: 1; color: #f4b942; }
  .ch.active .star { color: #fff; }
  .ch .hd { margin-left: auto; font-size: 10px; font-weight: 800; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: var(--muted); }
  .ch.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: var(--accent-text); box-shadow: 0 8px 22px var(--glow); }
  .ch.active .nr { color: rgba(255,255,255,.8); } .ch.active .hd { color: #fff; border-color: rgba(255,255,255,.5); }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }

  /* environment */
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .dot.bad { background: var(--bad); }
  .copy { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 9px; font-size: 12px; margin-left: 8px; color: var(--muted); }
  .copy:hover { color: var(--accent); border-color: var(--accent); }
  /* restart banner, selects, settings */
  .banner { position: sticky; top: 8px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; margin-bottom: 14px;
    background: var(--card-solid); border: 1px solid var(--warn); box-shadow: var(--shadow); }
  .banner b { color: var(--warn); }
  .selects { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; position: relative; z-index: 1; }
  .selects label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; flex: 1 1 200px; }
  select, input[type=number], input[type=text] { font: inherit; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-solid); color: var(--text); width: 100%; text-transform: none; letter-spacing: 0; font-weight: 500; }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .group { margin-bottom: 18px; }
  .field { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(200px, 1.2fr); gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .field:last-child { border-bottom: 0; }
  .field .fname { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field .fdesc { color: var(--muted); font-size: 13px; grid-column: 1; }
  .field .fctl { grid-row: 1 / span 2; grid-column: 2; }
  .tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); font-weight: 700; }
  .switch { position: relative; width: 48px; height: 28px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; border-radius: 50%; background: var(--card-solid); transition: .15s; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .switch input:checked + span { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .savebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: var(--accent-text); }
  @media (max-width: 560px) {
    .field { grid-template-columns: 1fr; } .field .fctl { grid-row: auto; grid-column: 1; }
  }
  @media (max-width: 560px) {
    .hero { padding: 16px; } .vol { margin-left: 0; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ch .logo { width: 64px; height: 42px; }
    .ch { flex-direction: column; align-items: flex-start; gap: 6px; position: relative; }
    .ch .name { white-space: normal; line-height: 1.2; }
    .ch .hd { position: absolute; top: 8px; right: 8px; margin: 0; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand"><img src="logo.png" alt="tv7"><span id="h-title">Player</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-player" aria-selected="true"></button>
      <button class="tab" role="tab" id="tab-set" aria-selected="false"></button>
    </div>
    <div class="tabs"><button class="tab" id="nerd-toggle" aria-pressed="false"></button></div>
  </header>

  <div id="banner" class="banner" hidden>
    <span><b id="banner-title"></b> <span id="banner-keys" class="sub"></span></span>
    <button class="btn primary" id="b-restart" style="margin-left:auto"></button>
  </div>
  <div id="msg" class="msg" hidden></div>

  <section id="view-player">
    <div class="hero" id="hero">
      <div class="hero-row">
        <div>
          <div class="kicker"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="kicker"></span></div>
          <div class="titlebar"><img id="now-logo" class="hero-logo" alt="" hidden><div class="title" id="now-title">–</div></div>
          <div class="sub" id="now-sub"></div>
        </div>
        <div class="chips" id="now-badges"></div>
      </div>
      <div class="selects">
        <label><span id="l-audio"></span><select id="sel-audio"></select></label>
        <label><span id="l-sub"></span><select id="sel-sub"></select></label>
      </div>
      <div class="transport">
        <button class="round" id="b-prev" aria-label=""></button>
        <button class="round big" id="b-stop" aria-label=""></button>
        <button class="round" id="b-next" aria-label=""></button>
        <div class="vol">
          <button class="round" id="b-vdown" aria-label="-"></button>
          <input type="range" id="vol" min="0" max="130" step="1" value="100">
          <button class="round" id="b-vup" aria-label="+"></button>
          <span class="vol-val" id="vol-val"></span>
          <button class="round" id="b-mute" aria-label=""></button>
        </div>
      </div>
    </div>

    <div class="card" id="search-card">
      <div class="toolbar" style="margin-bottom:0">
        <input type="search" id="q" autocomplete="off">
        <div class="seg" role="group" id="src-seg" title="Auto: multicast, then HLS">
          <button id="src-auto" aria-pressed="true">Auto</button>
          <button id="src-multicast" aria-pressed="false">Multicast</button>
          <button id="src-hls" aria-pressed="false">HLS</button>
        </div>
        <button class="btn" id="b-refresh"></button>
      </div>
    </div>
    <div class="card" id="card-fav" hidden><h2 id="h-fav"></h2><div class="grid" id="grid-fav"></div></div>
    <div class="card" id="card-srg" hidden><h2 id="h-srg"></h2><div class="grid" id="grid-srg"></div></div>
    <div class="card" id="card-tv7"><h2 id="h-tv7"></h2><div class="grid" id="grid-tv7"></div></div>
    <p class="hint" id="count"></p>
  </section>

  <section id="view-set" hidden>
    <div class="card support"><button class="btn primary" id="b-support"></button><p class="hint" id="support-hint"></p>
      <textarea id="support-text" readonly hidden></textarea></div>
    <p class="hint" id="set-intro" style="margin:0 4px 12px"></p>
    <div id="set-groups"></div>
    <div class="card nerd-card" id="nerd-card" hidden>
      <div class="nerd-grid" id="nerd-grid"></div>
      <div class="nerd-env">
        <div><h2 id="h-hdmi"></h2><div class="nerd-frame" id="env-hdmi"></div></div>
        <div><h2 id="h-cec">HDMI-CEC</h2><div class="nerd-frame" id="env-cec"></div></div>
        <div><h2 id="h-audio"></h2><div class="nerd-frame" id="env-audio"></div></div>
        <div><h2 id="h-opts"></h2><div class="nerd-frame" id="env-opts"></div></div>
      </div>
      <div class="nerd-log-head"><h2 id="h-nerd-log"></h2><span id="nerd-copy"></span></div>
      <pre class="nerd-log" id="nerd-log"></pre>
      <div class="nerd-log-head"><h2 id="h-cec-log"></h2><span id="cec-copy"></span></div>
      <pre class="nerd-log" id="cec-log"></pre>
    </div>
    <p class="footer" id="version"></p>
  </section>


</main>

<script>
"use strict";
const svg = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  prev: svg('<path d="M6 6h2v12H6zM20 6v12L9.5 12z"/>'), next: svg('<path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/>'),
  stop: svg('<rect x="6" y="6" width="12" height="12" rx="2"/>'), plus: svg('<path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>'), minus: svg('<path d="M5 11h14v2H5z"/>'),
  vol: svg('<path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 010 7l-1.4-1.4a3 3 0 000-4.2zM18.4 6a8.5 8.5 0 010 12l-1.4-1.4a6.5 6.5 0 000-9.2z"/>'),
  muted: svg('<path d="M4 9v6h4l5 4V5L8 9zM16.3 9.3l1.4-1.4L20 10.2l2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3z" transform="translate(-3 1.8)"/>'),
};
// Texts in English, German, French and Italian: i18n/<lang>.json ("ui"), filled in by control.py when it serves this page.
const I18N = /*I18N*/{};
const lang = (navigator.language || "en").slice(0, 2).toLowerCase();
const T = I18N[lang] || I18N.en;
document.documentElement.lang = I18N[lang] ? lang : "en";

$("nerd-toggle").onclick = () => setNerd(!nerdOn);

        [T.volume, a.volume == null ? null : Math.round(a.volume) + " %" + (a.mute ? " (" + T.mute + ")" : "")]]),
