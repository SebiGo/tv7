---
configuration:
  hdmi_port:
    name: 'Porta HDMI'
    description: 'A quale uscita HDMI è collegato il televisore. auto la trova. Su un Raspberry Pi, HDMI-A-1 è la porta accanto all''alimentazione.'
  cec:
    name: 'Telecomando (HDMI-CEC)'
    description: 'Usare TV7 con il telecomando del televisore o del proiettore. auto (predefinito) lo usa, a meno che l''integrazione HDMI-CEC di Home Assistant lo faccia già; l''opzione è allora disattivata. off lo spegne.'
  video_mode:
    name: 'Risoluzione dell''immagine'
    description: 'auto (predefinito) usa 1080p, adatto ai canali. Risoluzioni più alte caricano solo il dispositivo; il televisore ingrandisce l''immagine altrettanto bene.'
  decode_speed:
    name: 'Velocità di decodifica'
    description: 'quality (predefinito). fast risparmia un po'' di carico del processore con una perdita di qualità appena visibile.'
  audio_channels:
    name: 'Canali audio'
    description: 'auto inoltra l''audio surround al ricevitore; stereo invia sempre stereo.'
  idle_stop:
    name: 'Stop senza utilizzo'
    description: 'Ferma la riproduzione dopo questi minuti senza utilizzo, così il dispositivo non continua quando nessuno guarda. off (predefinito): mai.'
  debug:
    name: 'Registro di debug'
    description: 'Più dettagli nel registro dell''app, per le segnalazioni di errori.'
