---
configuration:
  hdmi_port:
    name: 'HDMI port'
    description: 'Which HDMI output the TV is connected to. auto finds it. On a Raspberry Pi, HDMI-A-1 is the port next to the power connector.'
  cec:
    name: 'TV remote (HDMI-CEC)'
    description: 'Use TV7 with the remote of your TV or projector. auto (default) uses it unless Home Assistant''s HDMI-CEC integration already does; the option is then greyed out. off switches it off.'
  video_mode:
    name: 'Picture resolution'
    description: 'auto (default) uses 1080p, which suits the channels. Higher resolutions only add load; the TV scales the picture just as well.'
  decode_speed:
    name: 'Decoding speed'
    description: 'quality (default). fast saves a little processor load at a barely visible cost in picture quality.'
  audio_channels:
    name: 'Audio channels'
    description: 'auto passes surround sound on to the receiver; stereo always sends stereo.'
  idle_stop:
    name: 'Stop without operation'
    description: 'Stops playback after this many minutes without operation, so the device does not keep playing when nobody watches. off (default): never.'
  debug:
    name: 'Debug log'
    description: 'More details in the app log, for bug reports.'
