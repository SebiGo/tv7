---
configuration:
  hdmi_port:
    name: 'HDMI-Anschluss'
    description: 'An welchem HDMI-Ausgang der Fernseher hängt. auto findet ihn. Beim Raspberry Pi ist HDMI-A-1 der Anschluss neben der Stromversorgung.'
  cec:
    name: 'Fernbedienung (HDMI-CEC)'
    description: 'TV7 mit der Fernbedienung von Fernseher oder Projektor bedienen. auto (Standard) nutzt sie, ausser die HDMI-CEC-Integration von Home Assistant tut das schon; die Option ist dann ausgegraut. off schaltet sie aus.'
  video_mode:
    name: 'Bildauflösung'
    description: 'auto (Standard) nimmt 1080p, das passt zu den Sendern. Höhere Auflösungen belasten nur das Gerät; der Fernseher skaliert das Bild genauso gut.'
  decode_speed:
    name: 'Dekodier-Tempo'
    description: 'quality (Standard). fast spart etwas Prozessorlast bei kaum sichtbar geringerer Bildqualität.'
  audio_channels:
    name: 'Tonkanäle'
    description: 'auto gibt Surround-Ton an den Receiver weiter; stereo sendet immer Stereo.'
  idle_stop:
    name: 'Stopp ohne Bedienung'
    description: 'Stoppt die Wiedergabe nach so vielen Minuten ohne Bedienung, damit das Gerät nicht weiterspielt, wenn niemand schaut. off (Standard): nie.'
  debug:
    name: 'Debug-Protokoll'
    description: 'Mehr Angaben im Protokoll der App, für Fehlermeldungen.'
